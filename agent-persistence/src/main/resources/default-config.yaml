active-provider: ollama
providers:
  ollama:
    type: ollama
    base-url: http://localhost:11434
    model: qwen2.5-coder:7b
    temperature: 0.2
    max-output-tokens: 8192
    thinking: false
    timeout-seconds: 120
    max-retries: 3
    output-protocol: natural-language
    max-output-repairs: 1

rag:
  embedding:
    # auto uses remote when base-url is configured; otherwise it tries bundled ONNX semantic
    # embeddings and falls back to deterministic fast hashing only if ONNX cannot initialize.
    # See examples/config.example.yaml for explicit onnx, fast, and remote modes.
    provider: auto
    dimensions: 384

security:
  shell:
    # Deny always wins. When allowlist-only is false, unmatched commands still go through risk
    # classification and approval instead of being silently allowed.
    allowlist-only: false
    allow-prefixes:
      - rg
      - git status
      - git diff
      - git log
      - get-content
      - get-childitem
    deny-fragments:
      - rm -rf
      - git reset --hard
      - git clean -f
      - "format "
      - diskpart
      - shutdown
      - reboot
      - remove-item -recurse -force
