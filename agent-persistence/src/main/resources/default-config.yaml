active-provider: ollama
providers:
  ollama:
    type: ollama
    base-url: http://localhost:11434
    model: qwen2.5-coder:7b
    temperature: 0.2
    max-output-tokens: 8192
    thinking: false
    timeout-seconds: 120
    max-retries: 3

rag:
  embedding:
    # fast = offline hashing model (no downloads, reproducible). Switch to `remote` for an
    # OpenAI-compatible /v1/embeddings endpoint; see examples/config.example.yaml.
    provider: fast
    dimensions: 384
