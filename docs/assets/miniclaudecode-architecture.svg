<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180" role="img" aria-labelledby="title desc">
  <title id="title">MiniClaudeCode 总体架构图</title>
  <desc id="desc">从终端用户入口，经会话、提示词、上下文与 Agent 状态图，连接模型 Provider、工具系统及本地持久化的架构。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 36px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #475569; }
      .box-title { font: 700 22px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .box-body { font: 400 17px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #334155; }
      .small { font: 400 15px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #475569; }
      .edge-label { font: 600 15px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #475569; }
      .group-title { font: 700 17px 'Segoe UI','Microsoft YaHei',sans-serif; fill: #334155; letter-spacing: 1px; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1180" fill="#f8fafc"/>
  <rect x="28" y="24" width="1864" height="1132" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="86" y="93" class="title">MiniClaudeCode：总体架构</text>
  <text x="86" y="127" class="subtitle">中心化主 Agent 通过状态图协调模型、工具、安全审批、检索与本地持久化</text>

  <!-- groups -->
  <rect x="70" y="172" width="490" height="625" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="96" y="208" class="group-title">用户入口与会话层</text>
  <rect x="615" y="172" width="575" height="625" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="642" y="208" class="group-title">Agent 编排与模型调用</text>
  <rect x="1245" y="172" width="605" height="625" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1272" y="208" class="group-title">工具与扩展能力</text>

  <!-- User and CLI -->
  <g filter="url(#shadow)">
    <rect x="130" y="250" width="365" height="94" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="312" y="287" text-anchor="middle" class="box-title">用户</text>
    <text x="312" y="317" text-anchor="middle" class="box-body">终端命令 / 交互 REPL</text>

    <rect x="130" y="405" width="365" height="112" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="312" y="446" text-anchor="middle" class="box-title">agent-cli</text>
    <text x="312" y="477" text-anchor="middle" class="box-body">Picocli + JLine</text>

    <rect x="110" y="580" width="405" height="145" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="312" y="620" text-anchor="middle" class="box-title">ApplicationSession</text>
    <text x="312" y="651" text-anchor="middle" class="box-body">会话、审计、恢复、流式渲染</text>
    <text x="312" y="680" text-anchor="middle" class="small">选择 Provider / 模型 / thinking</text>
  </g>

  <!-- Prompt and context -->
  <g filter="url(#shadow)">
    <rect x="665" y="250" width="220" height="116" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="775" y="291" text-anchor="middle" class="box-title">agent-prompt</text>
    <text x="775" y="321" text-anchor="middle" class="box-body">Prompt Pipeline</text>

    <rect x="925" y="250" width="220" height="116" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1035" y="291" text-anchor="middle" class="box-title">agent-context</text>
    <text x="1035" y="321" text-anchor="middle" class="box-body">预算、压缩、上下文变换</text>

    <rect x="690" y="447" width="430" height="145" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="905" y="492" text-anchor="middle" class="box-title">agent-runtime</text>
    <text x="905" y="523" text-anchor="middle" class="box-body">LangGraph4j Agent 状态图</text>
    <text x="905" y="553" text-anchor="middle" class="small">模型、工具、审批、重试、修复、验证、终止</text>

    <rect x="690" y="660" width="200" height="98" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="790" y="698" text-anchor="middle" class="box-title">agent-model-api</text>
    <text x="790" y="728" text-anchor="middle" class="box-body">ModelClient / 流事件</text>

    <rect x="930" y="660" width="190" height="98" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="1025" y="698" text-anchor="middle" class="box-title">agent-providers</text>
    <text x="1025" y="728" text-anchor="middle" class="box-body">Anthropic / OpenAI / Ollama</text>
  </g>

  <!-- Tools -->
  <g filter="url(#shadow)">
    <rect x="1390" y="247" width="315" height="118" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1547" y="290" text-anchor="middle" class="box-title">统一 Tool Registry</text>
    <text x="1547" y="321" text-anchor="middle" class="box-body">模型选择工具，系统执行与裁决</text>

    <rect x="1280" y="446" width="250" height="135" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1405" y="485" text-anchor="middle" class="box-title">agent-tools</text>
    <text x="1405" y="516" text-anchor="middle" class="box-body">文件 / Patch / 命令 / Web</text>
    <text x="1405" y="545" text-anchor="middle" class="small">Todo / Ask User / 权限与审批</text>

    <rect x="1570" y="446" width="240" height="135" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1690" y="485" text-anchor="middle" class="box-title">agent-rag</text>
    <text x="1690" y="516" text-anchor="middle" class="box-body">AST 分块 + Lucene</text>
    <text x="1690" y="545" text-anchor="middle" class="small">BM25 / 向量 / RRF</text>

    <rect x="1280" y="650" width="250" height="105" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1405" y="689" text-anchor="middle" class="box-title">agent-extensions</text>
    <text x="1405" y="720" text-anchor="middle" class="box-body">MCP / Skills / 只读子 Agent</text>

    <rect x="1570" y="650" width="240" height="105" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1690" y="689" text-anchor="middle" class="box-title">跨会话记忆</text>
    <text x="1690" y="720" text-anchor="middle" class="box-body">memory:search</text>
  </g>

  <!-- persistence and output -->
  <g filter="url(#shadow)">
    <rect x="360" y="895" width="690" height="150" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
    <text x="705" y="938" text-anchor="middle" class="box-title">agent-persistence：本地可恢复状态</text>
    <text x="705" y="972" text-anchor="middle" class="box-body">YAML 配置 · JSONL 会话事件 · 权限规则 · 工具账本 · Checkpoint · 索引诊断</text>
    <text x="705" y="1005" text-anchor="middle" class="small">供会话层、状态图和工具层共同读写</text>

    <rect x="1210" y="895" width="360" height="150" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
    <text x="1390" y="938" text-anchor="middle" class="box-title">输出层</text>
    <text x="1390" y="972" text-anchor="middle" class="box-body">输出协议 · 格式修复 · 终止</text>
    <text x="1390" y="1005" text-anchor="middle" class="small">最终文本 / 失败 / 取消</text>
  </g>

  <!-- edges -->
  <path d="M312 344 L312 405" class="edge"/>
  <path d="M312 517 L312 580" class="edge"/>
  <path d="M515 635 C585 635,585 307,665 307" class="edge"/>
  <path d="M515 670 C625 670,620 307,925 307" class="edge"/>
  <path d="M775 366 L815 447" class="edge"/>
  <path d="M1035 366 L995 447" class="edge"/>
  <path d="M905 592 L790 660" class="edge"/>
  <path d="M890 709 L930 709" class="edge"/>
  <path d="M1120 520 C1245 520,1255 307,1390 307" class="edge"/>
  <path d="M1547 365 L1405 446" class="edge"/>
  <path d="M1547 365 L1690 446" class="edge"/>
  <path d="M1460 365 L1405 650" class="edge"/>
  <path d="M1632 365 L1690 650" class="edge"/>
  <path d="M312 725 C312 820,570 820,570 895" class="edge-dashed"/>
  <path d="M820 592 C820 760,705 760,705 895" class="edge-dashed"/>
  <path d="M1547 365 C1547 800,840 800,840 895" class="edge-dashed"/>
  <path d="M1050 520 C1130 520,1160 970,1210 970" class="edge"/>
  <path d="M1390 1045 C1390 1100,312 1100,312 725" class="edge-dashed"/>

  <text x="532" y="513" class="edge-label">构造请求</text>
  <text x="1140" y="470" class="edge-label">工具调用</text>
  <text x="1080" y="950" class="edge-label">最终状态</text>
  <text x="900" y="1125" text-anchor="middle" class="small">实线：主要调用路径　　虚线：持久化/恢复与结果回流</text>
</svg>
