name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
      - name: Verify unit, CLI E2E, integration and distribution build
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Smoke test fat JAR
        shell: bash
        run: |
          java -jar agent-cli/target/mini-claude-code.jar --version
          java -jar agent-cli/target/mini-claude-code.jar --help
          mkdir -p target/fat-jar-smoke-home
          java -Duser.home=target/fat-jar-smoke-home \
            -jar agent-cli/target/mini-claude-code.jar \
            index -w agent-rag/src/test/resources/tree-sitter-smoke
      - name: Smoke test distribution archives
        shell: bash
        run: |
          ZIP=agent-cli/target/mini-claude-code-0.1.0-SNAPSHOT-distribution.zip
          TAR=agent-cli/target/mini-claude-code-0.1.0-SNAPSHOT-distribution.tar.gz
          test -s "$ZIP"
          test -s "$TAR"
          tar -tzf "$TAR" | grep -q '/lib/mini-claude-code.jar$'
          mkdir -p target/distribution-smoke
          unzip -q "$ZIP" -d target/distribution-smoke
          DIST_JAR=$(find target/distribution-smoke -path '*/lib/mini-claude-code.jar' -print -quit)
          test -n "$DIST_JAR"
          java -jar "$DIST_JAR" --version
          java -jar "$DIST_JAR" --help
