name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify unit tests and build
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Smoke test fat JAR
        shell: bash
        run: |
          java -jar target/minicode.jar --version
          java -jar target/minicode.jar --help
          mkdir -p target/fat-jar-smoke-home
          java -Duser.home=target/fat-jar-smoke-home \
            -jar target/minicode.jar \
            index -w src/test
      - name: Smoke test distribution archive
        shell: bash
        run: |
          ZIP=target/minicode-distribution.zip
          test -s "$ZIP"
          unzip -q "$ZIP" -d target/distribution-smoke
          DIST_JAR=$(find target/distribution-smoke -name 'minicode.jar' -print -quit)
          test -n "$DIST_JAR"
          java -jar "$DIST_JAR" --version
          java -jar "$DIST_JAR" --help
