# Code-index embeddings. `fast` (default) is the offline hashing model: zero dependencies,
# reproducible, fine for demos and CI. `remote` calls an OpenAI-compatible /v1/embeddings
# endpoint; `dimensions` must match what the model actually returns (the index checks and
# fails with a clear message when it does not). Switching provider or dimensions triggers a
# one-time full index rebuild — vectors from different models are not comparable.
# rag:
#   embedding:
#     provider: remote
#     base-url: https://api.openai.com/v1
#     api-key-env: OPENAI_API_KEY
#     model: text-embedding-3-small
#     dimensions: 1536
  #     timeout-seconds: 30
  #
  # Alibaba Cloud Model Studio / DashScope compatible mode. The Workspace ID and region are
  # account-specific; keep the key only in the named environment variable. text-embedding-v4
  # defaults to 1024 dimensions and accepts up to 10 inputs per request.
  # rag:
  #   embedding:
  #     provider: remote
  #     base-url: https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  #     api-key-env: DASHSCOPE_API_KEY
  #     model: text-embedding-v4
  #     dimensions: 1024
  #     timeout-seconds: 60

# MCP is loaded only from this user config file, never from project config.
# mcp:
#   servers:
#     local-server:
#       transport: stdio
#       command: ["java", "-jar", "C:/absolute/path/server.jar"]
#       launch-approved: false
#       risk: HIGH

# Shell policy is user-controlled. Project config is not allowed to override `security`.
# Deny always wins; allow prefixes never bypass HIGH/CRITICAL risk classification.
security:
  shell:
    allowlist-only: false
    allow-prefixes:
      - rg
      - git status
      - git diff
      - git log
      - get-content
      - get-childitem
    deny-fragments:
      - rm -rf
      - git reset --hard
      - git clean -f
      - "format "
      - diskpart
      - shutdown
      - reboot
      - remove-item -recurse -force
