# Fixed hybrid workflow bounds. Complex tasks use a durable Plan; every step still runs ReAct.
execution:
  mode: hybrid
  max-direct-attempts: 2
  max-step-attempts: 2
  max-replans: 1

planning:
  enabled: true
  max-steps: 12
  max-attempts-per-step: 2
  max-revisions: 1

# Session transcripts remain JSONL. Cross-session memory uses SQLite FTS5 (no embeddings).
# Durable user-stated or tool-verified candidates are gated and written directly as ACTIVE.
memory:
  enabled: true
  backend: sqlite
  top-k: 3
  max-injection-tokens: 1000
  consolidate-after: 10
  post-turn-extraction: signal-gated
  embedding:
    enabled: false

# Code-index embeddings. `remote` calls an OpenAI-compatible /v1/embeddings endpoint and is
# recommended for semantic retrieval. `fast` is a deterministic local hashing fallback with no
# model dependency. `auto` chooses remote when base-url is present, otherwise fast. Dimensions must match the
# response. Switching provider, endpoint, model, or dimensions triggers a full index rebuild.
# rag:
#   embedding:
#     provider: auto
#     dimensions: 384
#
# rag:
#   embedding:
#     provider: remote
#     base-url: https://api.openai.com/v1
#     api-key-env: OPENAI_API_KEY
#     model: text-embedding-3-small
#     dimensions: 1536
#     timeout-seconds: 30
#
# Alibaba Cloud Model Studio / DashScope compatible mode. The Workspace ID and region are
# account-specific; keep the key only in the named environment variable. text-embedding-v4
# defaults to 1024 dimensions and accepts up to 10 inputs per request.
# rag:
#   embedding:
#     provider: remote
#     base-url: https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
#     api-key-env: DASHSCOPE_API_KEY
#     model: text-embedding-v4
#     dimensions: 1024
  #     timeout-seconds: 60

# MCP is loaded only from this user config file, never from project config.
# mcp:
#   servers:
#     local-server:
#       transport: stdio
#       command: ["java", "-jar", "C:/absolute/path/server.jar"]
#       launch-approved: false
#       risk: HIGH

# Shell policy is user-controlled. Project config is not allowed to override `security`.
# Deny always wins; allow prefixes never bypass HIGH/CRITICAL risk classification.
security:
  shell:
    allowlist-only: false
    allow-prefixes:
      - rg
      - git status
      - git diff
      - git log
      - get-content
      - get-childitem
    deny-fragments:
      - rm -rf
      - git reset --hard
      - git clean -f
      - "format "
      - diskpart
      - shutdown
      - reboot
      - remove-item -recurse -force
