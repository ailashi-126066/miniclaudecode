active-provider: ollama

providers:
  ollama:
    type: ollama
    base-url: http://localhost:11434
    model: qwen2.5-coder:7b
    temperature: 0.2
    max-output-tokens: 8192
    thinking: false
    timeout-seconds: 120
    max-retries: 3
    output-protocol: natural-language
    max-output-repairs: 1

  # anthropic:
  #   type: anthropic
  #   api-key-env: ANTHROPIC_API_KEY
  #   model: claude-sonnet-4-5
  #   max-output-tokens: 8192
  #   thinking: true
  #   output-protocol: natural-language
  #   max-output-repairs: 1
