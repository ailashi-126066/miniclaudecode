[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pycode"
version = "0.1.0"
description = "pycode: a Python coding agent with persistent conversation branches"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.23",
    "httpx>=0.28,<0.29",
    "pyyaml>=6,<7",
    "textual>=8.2.5,<9",
    "jsonschema>=4.26,<5",
    "langchain[mcp]==1.4.4",
    "langgraph==1.2.14",
    "langmem==0.0.30",
    "pydantic>=2.7,<3",
    "langchain-deepseek>=1,<2",
    "langchain-openai>=1.7,<2",
    "langchain-anthropic>=1.7.5,<2",
]

[project.scripts]
pycode = "pycode.app.cli:main"

[project.optional-dependencies]
eval = ["langfuse==4.17.0", "openevals==0.2.0", "agentevals==0.0.9"]
dev = ["editables==0.6", "pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.17,<1", "build>=1,<2", "hatchling>=1.27,<2", "pyright==1.1.414"]

[tool.hatch.build.targets.wheel]
packages = ["src/pycode"]

[tool.hatch.build.targets.wheel.force-include]
"docs/licenses" = "pycode/licenses"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "evals", "docs", "pyproject.toml", "README.md", ".env.example", "requirements-dev.lock"]
exclude = ["archive", ".worktrees", "tests/.runtime-tests", "tests/.fix-20261013", "tests/audit-20261013", "tests/dependency-artifacts", "evals/cache", "evals/work", "evals/results"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tests"]
norecursedirs = [".git", ".venv", ".runtime-tests", ".t", ".fix-20261013", "audit-20261013", "cache", "work", "results", "dependency-artifacts", "memory_rules"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = [".source-cache", ".venv", ".worktrees", "archive", "tests/.runtime-tests", "tests/.t", "tests/.fix-20261013", "tests/audit-20261013", "tests/dependency-artifacts", "evals/cache", "evals/work", "evals/results", "evals/memory_rules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]

[tool.pyright]
include = ["src/pycode"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingTypeStubs = false
